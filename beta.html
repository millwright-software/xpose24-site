<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>xpose24 — Private beta</title>
<meta name="description" content="xpose24 private beta.">
<style>
  :root {
    --bg: #101013;
    --amber: #f59e0b;
    --silver: #d7d9dd;
    --dim: #5d616a;
    --ink: #0a0a0c;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: radial-gradient(120% 90% at 50% 40%, #17171b 0%, var(--bg) 55%, #0a0a0d 100%);
    color: var(--silver);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* 35mm sprocket strips framing the page */
  .sprockets {
    flex: none;
    height: 34px;
    background-color: var(--ink);
    background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="34" height="34"><rect x="10" y="11" width="14" height="12" rx="2.5" fill="%2318181d"/><rect x="10.5" y="11.5" width="13" height="11" rx="2" fill="none" stroke="%23000" stroke-opacity=".8"/></svg>');
    background-repeat: repeat-x;
    box-shadow: inset 0 -1px 0 rgba(200,155,75,.14);
  }
  .sprockets.bottom { box-shadow: inset 0 1px 0 rgba(200,155,75,.14); }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 48px 24px;
  }

  h1 {
    margin: 0;
    font-family: "Avenir Next", Avenir, Futura, "Century Gothic", sans-serif;
    font-size: clamp(44px, 10vw, 64px);
    font-weight: 600;
    letter-spacing: .04em;
    color: var(--silver);
  }

  .status {
    margin: 26px 0 0;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .5em;
    text-indent: .5em;
    text-transform: uppercase;
    color: var(--amber);
    text-shadow: 0 0 14px rgba(245,158,11,.3);
  }

  /* ---- passphrase gate ---- */
  #gate { margin-top: 40px; }
  #gate p {
    margin: 0 0 18px;
    font-size: 15px;
    color: var(--dim);
  }
  #gate form {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  #pass {
    background: var(--ink);
    border: 1px solid #2a2a30;
    border-radius: 6px;
    color: var(--silver);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 16px;
    letter-spacing: .08em;
    padding: 12px 14px;
    width: min(260px, 70vw);
    outline: none;
  }
  #pass:focus { border-color: rgba(245,158,11,.55); box-shadow: 0 0 0 3px rgba(245,158,11,.12); }
  #gate button {
    background: linear-gradient(180deg, #2a2a30, #1b1b20);
    border: 1px solid #34343b;
    border-radius: 6px;
    color: var(--amber);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .18em;
    text-transform: uppercase;
    padding: 12px 20px;
    cursor: pointer;
  }
  #gate button:hover { border-color: rgba(245,158,11,.45); }
  #gate button:disabled { opacity: .5; cursor: wait; }
  #err {
    margin-top: 16px;
    min-height: 18px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: #e5484d;
    visibility: hidden;
  }
  #err.show { visibility: visible; }

  /* ---- unlocked content ---- */
  #content { display: none; }
  body.unlocked main { justify-content: flex-start; }
  body.unlocked #gate { display: none; }
  body.unlocked #content {
    display: block;
    text-align: left;
    max-width: 560px;
    width: 100%;
    margin-top: 34px;
    animation: develop 1.4s ease both;
  }
  @keyframes develop {
    from { opacity: 0; filter: blur(6px) saturate(.4); }
    to   { opacity: 1; filter: blur(0) saturate(1); }
  }
  #content h2 {
    margin: 38px 0 12px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: var(--amber);
  }
  #content p, #content li {
    font-size: 16px;
    line-height: 1.65;
    color: var(--silver);
  }
  #content .lede { font-size: 18px; line-height: 1.6; }
  #content .tagline { margin: 6px 0 0; font-size: 15px; color: var(--dim); letter-spacing: .02em; }
  #content ul, #content ol { padding-left: 22px; margin: 10px 0; }
  #content li { margin: 8px 0; }
  #content a { color: var(--amber); }
  #content strong { color: #fff; font-weight: 600; }
  #content em { color: var(--amber); font-style: normal; }
  #content .invite-slot { margin-top: 20px; }
  #content .invite-pending {
    display: inline-block;
    border: 1px dashed #34343b;
    border-radius: 6px;
    padding: 12px 16px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 13px;
    color: var(--dim);
  }
  #content .invite-btn {
    display: inline-block;
    background: linear-gradient(180deg, #f8b344, #e08c07);
    border-radius: 8px;
    color: var(--ink);
    font-weight: 700;
    font-size: 16px;
    letter-spacing: .03em;
    text-decoration: none;
    padding: 14px 26px;
    box-shadow: 0 4px 18px rgba(245,158,11,.25);
  }
  /* Amber-edged panel for the one thing a tester must not misread: that the
     film prices are not real money. Reads as a notice, not body copy. */
  #content .callout {
    margin: 12px 0;
    padding: 14px 16px;
    border-left: 2px solid var(--amber);
    border-radius: 0 6px 6px 0;
    background: rgba(245, 158, 11, .07);
  }
  #content .fineprint {
    margin-top: 34px;
    padding-top: 18px;
    border-top: 1px solid #222228;
    font-size: 13px;
    color: var(--dim);
  }

  footer {
    flex: none;
    text-align: center;
    padding: 18px 20px 22px;
  }
  footer p {
    margin: 0;
    font-size: 12px;
    letter-spacing: .05em;
    color: var(--dim);
  }
</style>
</head>
<body>
<div class="sprockets" aria-hidden="true"></div>

<main>
  <h1>xpose24</h1>
  <p class="status">Private beta</p>

  <div id="gate">
    <p>This roll is sealed. Enter the passphrase from your invite.</p>
    <form id="gateform" autocomplete="off">
      <input id="pass" type="password" inputmode="text" autocapitalize="none"
             autocorrect="off" spellcheck="false" aria-label="Passphrase" autofocus>
      <button id="unlock" type="submit">Unlock</button>
    </form>
    <p id="err" role="alert">Wrong passphrase — check your invite</p>
  </div>

  <div id="content"></div>
</main>

<div class="sprockets bottom" aria-hidden="true"></div>

<footer>
  <p>© 2026 Millwright Software</p>
</footer>

  var form = document.getElementById('gateform');
  var input = document.getElementById('pass');
  var button = document.getElementById('unlock');
  var err = document.getElementById('err');
  var SS_KEY = 'xpose24-beta-pass';

  function b64ToBytes(b64) {
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  async function decrypt(passphrase) {
    var enc = new TextEncoder();
    var baseKey = await crypto.subtle.importKey(
      'raw', enc.encode(passphrase), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64ToBytes(ENC.salt), iterations: ENC.iterations, hash: 'SHA-256' },
      baseKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var plain = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: b64ToBytes(ENC.iv) }, key, b64ToBytes(ENC.ct));
    return new TextDecoder().decode(plain);
  }

  async function tryUnlock(passphrase, interactive) {
    button.disabled = true;
    err.classList.remove('show');
    try {
      var html = await decrypt(passphrase.trim());
      try { sessionStorage.setItem(SS_KEY, passphrase.trim()); } catch (e) {}
      document.getElementById('content').innerHTML = html;
      document.body.classList.add('unlocked');
    } catch (e) {
      try { sessionStorage.removeItem(SS_KEY); } catch (e2) {}
      if (interactive) {
        err.classList.add('show');
        input.select();
      }
    } finally {
      button.disabled = false;
    }
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (input.value) tryUnlock(input.value, true);
  });

  try {
    var cached = sessionStorage.getItem(SS_KEY);
    if (cached) tryUnlock(cached, false);
  } catch (e) {}
})();
</script>
</body>
</html>
